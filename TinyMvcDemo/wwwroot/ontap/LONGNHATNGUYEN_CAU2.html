<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cau 2 - Quan ly san pham</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #edf3f1;
            color: #21313c;
            padding: 24px;
        }

        .container {
            width: min(100%, 1100px);
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 16px 36px rgba(33, 49, 60, 0.12);
            overflow: hidden;
        }

        .student-info {
            background: #18324a;
            color: #ffffff;
            padding: 18px 24px;
            font-weight: 700;
        }

        .content {
            padding: 24px;
        }

        h1,
        h2 {
            color: #18324a;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.8rem;
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 28px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 20px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .required {
            color: #c62828;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:hover,
        select:hover,
        input:focus,
        select:focus {
            border-color: #1f6f78;
            box-shadow: 0 0 0 3px rgba(31, 111, 120, 0.12);
            outline: none;
        }

        .hint {
            color: #64748b;
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .error {
            min-height: 18px;
            margin-top: 4px;
            color: #c62828;
            font-size: 0.85rem;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #1f6f78;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #18324a;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #18324a;
        }

        .btn-danger {
            background: #c62828;
            color: #ffffff;
            padding: 7px 12px;
            font-size: 0.85rem;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #e7f6ed;
            color: #166534;
            font-weight: 700;
        }

        .message.show {
            display: block;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.95rem;
        }

        th {
            background: #18324a;
            color: #ffffff;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: #eef7f5;
        }

        .empty {
            padding: 18px 0;
            text-align: center;
            color: #64748b;
            font-style: italic;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .content {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="student-info">
            MASV: K24DTCN000 - Ho ten: Long Nhat Nguyen
        </div>

        <div class="content">
            <h1>Quan ly san pham</h1>

            <form id="productForm" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productCode">Ma san pham <span class="required">*</span></label>
                        <input id="productCode" type="text" maxlength="8" placeholder="VD: 12345678">
                        <div class="hint">Bat buoc la 8 chu so va khong duoc trung.</div>
                        <div id="codeError" class="error"></div>
                    </div>

                    <div class="form-group">
                        <label for="category">Chung loai <span class="required">*</span></label>
                        <select id="category">
                            <option value="">-- Chon chung loai --</option>
                            <option value="Dien tu">Dien tu</option>
                            <option value="Gia dung">Gia dung</option>
                            <option value="Thoi trang">Thoi trang</option>
                            <option value="Van phong pham">Van phong pham</option>
                            <option value="Khac">Khac</option>
                        </select>
                        <div id="categoryError" class="error"></div>
                    </div>

                    <div class="form-group full">
                        <label for="productName">Ten san pham <span class="required">*</span></label>
                        <input id="productName" type="text" maxlength="300" placeholder="Nhap ten san pham">
                        <div class="hint"><span id="nameCount">0</span> / 300 ky tu</div>
                        <div id="nameError" class="error"></div>
                    </div>

                    <div class="form-group">
                        <label for="quantity">So luong <span class="required">*</span></label>
                        <input id="quantity" type="number" min="1" step="1" placeholder="VD: 10">
                        <div id="quantityError" class="error"></div>
                    </div>

                    <div class="form-group">
                        <label for="price">Don gia <span class="required">*</span></label>
                        <input id="price" type="number" min="1" step="1" placeholder="VD: 250000">
                        <div id="priceError" class="error"></div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn-primary" type="button" onclick="addProduct()">Them san pham</button>
                    <button class="btn-secondary" type="button" onclick="resetForm()">Nhap lai</button>
                </div>
                <div id="message" class="message"></div>
            </form>

            <h2>Danh sach san pham da nhap</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Ma SP</th>
                            <th>Ten san pham</th>
                            <th>So luong</th>
                            <th>Don gia</th>
                            <th>Chung loai</th>
                            <th>Thanh tien</th>
                            <th>Xoa</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody"></tbody>
                </table>
                <div id="emptyMessage" class="empty">Chua co san pham nao.</div>
            </div>
        </div>
    </main>

    <script>
        const storageKey = "ltw_products";

        function getProducts() {
            const data = localStorage.getItem(storageKey);
            return data ? JSON.parse(data) : [];
        }

        function saveProducts(products) {
            localStorage.setItem(storageKey, JSON.stringify(products));
        }

        function initProducts() {
            if (localStorage.getItem(storageKey)) {
                return;
            }

            const sample = [
                { code: "12345678", name: "Ban phim co", quantity: 5, price: 650000, category: "Dien tu" },
                { code: "87654321", name: "Binh giu nhiet", quantity: 12, price: 180000, category: "Gia dung" }
            ];
            saveProducts(sample);
        }

        function setError(id, message) {
            document.getElementById(id).textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll(".error").forEach(error => {
                error.textContent = "";
            });
            const message = document.getElementById("message");
            message.classList.remove("show");
            message.textContent = "";
        }

        function isPositiveInteger(value) {
            return /^[1-9]\d*$/.test(value);
        }

        function validateProduct(product) {
            let valid = true;
            const products = getProducts();

            if (!product.code) {
                setError("codeError", "Ma san pham khong duoc de trong.");
                valid = false;
            } else if (!/^\d{8}$/.test(product.code)) {
                setError("codeError", "Ma san pham phai gom dung 8 chu so.");
                valid = false;
            } else if (products.some(item => item.code === product.code)) {
                setError("codeError", "Ma san pham da ton tai.");
                valid = false;
            }

            if (!product.name) {
                setError("nameError", "Ten san pham khong duoc de trong.");
                valid = false;
            } else if (product.name.length > 300) {
                setError("nameError", "Ten san pham toi da 300 ky tu.");
                valid = false;
            }

            if (!isPositiveInteger(product.quantityText)) {
                setError("quantityError", "So luong phai la so nguyen lon hon 0.");
                valid = false;
            }

            if (!isPositiveInteger(product.priceText)) {
                setError("priceError", "Don gia phai la so nguyen lon hon 0.");
                valid = false;
            }

            if (!product.category) {
                setError("categoryError", "Vui long chon chung loai.");
                valid = false;
            }

            return valid;
        }

        function addProduct() {
            clearErrors();

            const product = {
                code: document.getElementById("productCode").value.trim(),
                name: document.getElementById("productName").value.trim(),
                quantityText: document.getElementById("quantity").value.trim(),
                priceText: document.getElementById("price").value.trim(),
                category: document.getElementById("category").value
            };

            if (!validateProduct(product)) {
                return;
            }

            const products = getProducts();
            products.push({
                code: product.code,
                name: product.name,
                quantity: parseInt(product.quantityText, 10),
                price: parseInt(product.priceText, 10),
                category: product.category
            });
            saveProducts(products);
            renderProducts();
            resetForm(false);

            const message = document.getElementById("message");
            message.textContent = "Them san pham thanh cong!";
            message.classList.add("show");
        }

        function deleteProduct(index) {
            if (!confirm("Xoa san pham nay?")) {
                return;
            }

            const products = getProducts();
            products.splice(index, 1);
            saveProducts(products);
            renderProducts();
        }

        function resetForm(clearMessage = true) {
            document.getElementById("productForm").reset();
            document.getElementById("nameCount").textContent = "0";
            if (clearMessage) {
                clearErrors();
            }
        }

        function formatMoney(value) {
            return new Intl.NumberFormat("vi-VN").format(value) + " VND";
        }

        function renderProducts() {
            const products = getProducts();
            const tbody = document.getElementById("productTableBody");
            const empty = document.getElementById("emptyMessage");

            if (products.length === 0) {
                tbody.innerHTML = "";
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            tbody.innerHTML = products.map((product, index) => {
                const total = product.quantity * product.price;
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${product.code}</strong></td>
                        <td>${product.name}</td>
                        <td>${product.quantity}</td>
                        <td>${formatMoney(product.price)}</td>
                        <td>${product.category}</td>
                        <td>${formatMoney(total)}</td>
                        <td><button class="btn-danger" type="button" onclick="deleteProduct(${index})">Xoa</button></td>
                    </tr>
                `;
            }).join("");
        }

        document.getElementById("productName").addEventListener("input", function () {
            document.getElementById("nameCount").textContent = this.value.length;
        });

        window.onload = function () {
            initProducts();
            renderProducts();
        };
    </script>
</body>
</html>
