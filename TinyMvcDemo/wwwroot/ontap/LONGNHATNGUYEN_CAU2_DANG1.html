<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 2 Dạng 1 - Đăng ký tài khoản</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background:
                linear-gradient(90deg, rgba(35, 65, 95, 0.05) 1px, transparent 1px),
                linear-gradient(0deg, rgba(35, 65, 95, 0.05) 1px, transparent 1px),
                #f6fbff;
            background-size: 30px 30px;
            color: #203040;
            padding: 24px;
        }

        .desk {
            width: min(100%, 1120px);
            margin: 0 auto;
        }

        .student-info {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            padding: 16px 18px;
            border-radius: 8px;
            background: #23415f;
            color: #ffffff;
            font-weight: 800;
        }

        .layout {
            display: grid;
            grid-template-columns: 0.92fr 1.08fr;
            gap: 18px;
            margin-top: 18px;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #d7e2eb;
            border-radius: 8px;
            box-shadow: 0 14px 32px rgba(32, 48, 64, 0.1);
        }

        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid #e5edf3;
        }

        .panel-header span {
            display: inline-block;
            margin-bottom: 8px;
            color: #2f6f90;
            font-size: 0.82rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1,
        h2 {
            color: #18324a;
        }

        h1 {
            font-size: 1.8rem;
        }

        h2 {
            font-size: 1.2rem;
        }

        form {
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 18px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .required {
            color: #d94f30;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:hover,
        input:focus {
            border-color: #2f6f90;
            box-shadow: 0 0 0 3px rgba(47, 111, 144, 0.13);
            outline: none;
        }

        .hint {
            color: #66788a;
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .error {
            min-height: 18px;
            margin-top: 4px;
            color: #c62828;
            font-size: 0.85rem;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #2f6f90;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #18324a;
        }

        .btn-secondary {
            background: #e8eef3;
            color: #23415f;
        }

        .btn-danger {
            background: #d94f30;
            color: #ffffff;
            padding: 7px 12px;
            font-size: 0.85rem;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #e7f6ed;
            color: #166534;
            font-weight: 800;
        }

        .message.show {
            display: block;
        }

        .summary-strip {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            padding: 0 20px 20px;
        }

        .summary-strip div {
            padding: 14px;
            border-radius: 8px;
            background: #eef6fb;
            border-left: 5px solid #2f6f90;
        }

        .summary-strip strong {
            display: block;
            color: #18324a;
            font-size: 1.4rem;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 20px 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th {
            background: #23415f;
            color: #ffffff;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: #eef6fb;
        }

        .empty {
            padding: 18px 0;
            text-align: center;
            color: #66788a;
            font-style: italic;
        }

        @media (max-width: 860px) {
            .layout,
            .form-grid,
            .summary-strip {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            body {
                padding: 12px;
            }

            .actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="desk">
        <div class="student-info">
            <span>Mã SV: K24DTCN000</span>
            <span>Họ tên: Long Nhật Nguyễn</span>
        </div>

        <section class="layout">
            <section class="panel">
                <div class="panel-header">
                    <span>Phiếu đăng ký</span>
                    <h1>Đăng ký tài khoản</h1>
                </div>

                <form id="accountForm" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fullName">Họ tên <span class="required">*</span></label>
                            <input id="fullName" type="text" placeholder="Nhập họ tên">
                            <div id="nameError" class="error"></div>
                        </div>

                        <div class="form-group">
                            <label for="birthDate">Ngày sinh <span class="required">*</span></label>
                            <input id="birthDate" type="text" placeholder="dd/mm/yyyy">
                            <div class="hint">Dùng định dạng dd/mm/yyyy.</div>
                            <div id="birthError" class="error"></div>
                        </div>

                        <div class="form-group full">
                            <label for="email">Email <span class="required">*</span></label>
                            <input id="email" type="text" placeholder="VD: sinhvien@example.com">
                            <div id="emailError" class="error"></div>
                        </div>

                        <div class="form-group">
                            <label for="password">Mật khẩu <span class="required">*</span></label>
                            <input id="password" type="password" placeholder="Tối thiểu 6 ký tự, gồm chữ và số">
                            <div id="passwordError" class="error"></div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
                            <input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu">
                            <div id="confirmError" class="error"></div>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-primary" type="button" onclick="addAccount()">Đăng ký</button>
                        <button class="btn-secondary" type="button" onclick="resetForm()">Nhập lại</button>
                    </div>
                    <div id="message" class="message"></div>
                </form>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <span>Dữ liệu Web Storage</span>
                    <h2>Danh sách tài khoản đã đăng ký</h2>
                </div>

                <div class="summary-strip">
                    <div>
                        <strong id="accountCount">0</strong>
                        <span>Tài khoản đã lưu</span>
                    </div>
                    <div>
                        <strong>localStorage</strong>
                        <span>Lưu dữ liệu trên trình duyệt</span>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Họ tên</th>
                                <th>Ngày sinh</th>
                                <th>Email</th>
                                <th>Xóa</th>
                            </tr>
                        </thead>
                        <tbody id="accountTableBody"></tbody>
                    </table>
                    <div id="emptyMessage" class="empty">Chưa có tài khoản nào.</div>
                </div>
            </section>
        </section>
    </main>

    <script>
        const storageKey = "ltw_accounts";

        function getAccounts() {
            const data = localStorage.getItem(storageKey);
            return data ? JSON.parse(data) : [];
        }

        function saveAccounts(accounts) {
            localStorage.setItem(storageKey, JSON.stringify(accounts));
        }

        function initAccounts() {
            if (localStorage.getItem(storageKey)) {
                return;
            }

            saveAccounts([
                { fullName: "Nguyễn Văn A", birthDate: "12/03/2004", email: "nguyenvana@example.com" },
                { fullName: "Trần Thị B", birthDate: "25/10/2005", email: "tranthib@example.com" }
            ]);
        }

        function setError(id, message) {
            document.getElementById(id).textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll(".error").forEach(error => {
                error.textContent = "";
            });
            const message = document.getElementById("message");
            message.classList.remove("show");
            message.textContent = "";
        }

        function isValidBirthDate(value) {
            if (!/^\d{2}\/\d{2}\/\d{4}$/.test(value)) {
                return false;
            }

            const [dayText, monthText, yearText] = value.split("/");
            const day = parseInt(dayText, 10);
            const month = parseInt(monthText, 10);
            const year = parseInt(yearText, 10);
            const date = new Date(year, month - 1, day);

            return date.getFullYear() === year
                && date.getMonth() === month - 1
                && date.getDate() === day;
        }

        function validateAccount(account) {
            let valid = true;

            if (!account.fullName) {
                setError("nameError", "Họ tên không được để trống.");
                valid = false;
            }

            if (!account.birthDate) {
                setError("birthError", "Ngày sinh không được để trống.");
                valid = false;
            } else if (!isValidBirthDate(account.birthDate)) {
                setError("birthError", "Ngày sinh phải đúng định dạng dd/mm/yyyy.");
                valid = false;
            }

            if (!account.email) {
                setError("emailError", "Email không được để trống.");
                valid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(account.email)) {
                setError("emailError", "Email phải có định dạng hợp lệ và có ký tự @.");
                valid = false;
            } else if (getAccounts().some(item => item.email.toLowerCase() === account.email.toLowerCase())) {
                setError("emailError", "Email này đã được đăng ký.");
                valid = false;
            }

            if (!account.password) {
                setError("passwordError", "Mật khẩu không được để trống.");
                valid = false;
            } else if (account.password.length < 6 || !/[A-Za-z]/.test(account.password) || !/\d/.test(account.password)) {
                setError("passwordError", "Mật khẩu tối thiểu 6 ký tự và phải gồm chữ với số.");
                valid = false;
            }

            if (!account.confirmPassword) {
                setError("confirmError", "Vui lòng xác nhận mật khẩu.");
                valid = false;
            } else if (account.confirmPassword !== account.password) {
                setError("confirmError", "Xác nhận mật khẩu không trùng khớp.");
                valid = false;
            }

            return valid;
        }

        function addAccount() {
            clearErrors();

            const account = {
                fullName: document.getElementById("fullName").value.trim(),
                birthDate: document.getElementById("birthDate").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                confirmPassword: document.getElementById("confirmPassword").value
            };

            if (!validateAccount(account)) {
                return;
            }

            const accounts = getAccounts();
            accounts.push({
                fullName: account.fullName,
                birthDate: account.birthDate,
                email: account.email
            });
            saveAccounts(accounts);
            renderAccounts();
            resetForm(false);

            const message = document.getElementById("message");
            message.textContent = "Đăng ký tài khoản thành công!";
            message.classList.add("show");
        }

        function deleteAccount(index) {
            if (!confirm("Xóa tài khoản này?")) {
                return;
            }

            const accounts = getAccounts();
            accounts.splice(index, 1);
            saveAccounts(accounts);
            renderAccounts();
        }

        function resetForm(clearMessage = true) {
            document.getElementById("accountForm").reset();
            if (clearMessage) {
                clearErrors();
            }
        }

        function renderAccounts() {
            const accounts = getAccounts();
            const tbody = document.getElementById("accountTableBody");
            const empty = document.getElementById("emptyMessage");
            document.getElementById("accountCount").textContent = accounts.length;

            if (accounts.length === 0) {
                tbody.innerHTML = "";
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";
            tbody.innerHTML = accounts.map((account, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${account.fullName}</td>
                    <td>${account.birthDate}</td>
                    <td>${account.email}</td>
                    <td><button class="btn-danger" type="button" onclick="deleteAccount(${index})">Xóa</button></td>
                </tr>
            `).join("");
        }

        window.onload = function () {
            initAccounts();
            renderAccounts();
        };
    </script>
</body>
</html>
