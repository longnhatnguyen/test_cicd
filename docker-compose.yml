services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: local-jenkins
    user: "0:0"
    restart: unless-stopped
    ports:
      - "8088:8080"
      - "50001:50000"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
