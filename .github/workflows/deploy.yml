name: Docker CI/CD

on:
  # Tu dong chay moi khi co code moi duoc push len nhanh main.
  push:
    branches:
      - main
  # Cho phep bam tay "Run workflow" tren giao dien GitHub Actions.
  workflow_dispatch:

env:
  # Registry de luu Docker image sau khi build.
  REGISTRY: ghcr.io
  # Thu muc app tren server, workflow se SSH vao day de deploy.
  APP_DIRECTORY: /opt/test_cicd

jobs:
  build-and-push:
    # Job nay build app, build image va push image len GHCR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Truyen cac gia tri can thiet sang job deploy.
      app_image_repo: ${{ steps.image.outputs.app_image_repo }}
      bot_image_repo: ${{ steps.image.outputs.bot_image_repo }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      deployed_at: ${{ steps.vars.outputs.deployed_at }}
      short_commit: ${{ steps.vars.outputs.short_commit }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: |
          dotnet restore TinyMvcDemo/TinyMvcDemo.csproj
          dotnet restore TelegramAiBot/TelegramAiBot.csproj

      - name: Build application
        run: |
          dotnet build TinyMvcDemo/TinyMvcDemo.csproj --configuration Release --no-restore
          dotnet build TelegramAiBot/TelegramAiBot.csproj --configuration Release --no-restore

      - name: Prepare image metadata
        # Tao ten image rieng cho web app va bot.
        id: image
        shell: bash
        run: |
          IMAGE_BASE="$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "app_image_repo=${IMAGE_BASE}-app" >> "$GITHUB_OUTPUT"
          echo "bot_image_repo=${IMAGE_BASE}-telegram-bot" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy variables
        # Cat SHA commit cho gon va tao moc thoi gian deploy.
        id: vars
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "short_commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date '+%Y-%m-%d %H:%M:%S %z')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        # Dang nhap vao GitHub Container Registry de co quyen push image.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./TinyMvcDemo
          file: ./TinyMvcDemo/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.app_image_repo }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.image.outputs.app_image_repo }}:latest

      - name: Build and push telegram bot image
        uses: docker/build-push-action@v6
        with:
          context: ./TelegramAiBot
          file: ./TelegramAiBot/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.bot_image_repo }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.image.outputs.bot_image_repo }}:latest

  deploy:
    # Chi deploy sau khi build-and-push thanh cong.
    runs-on: ubuntu-latest
    needs: build-and-push
    # Khoa deploy chi cho nhanh main.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Docker server over SSH
        # SSH vao server va cap nhat container bang image moi vua duoc push.
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Cac bien nay duoc truyen sang shell tren server de docker compose dung lai.
          IMAGE_REPO: ${{ needs.build-and-push.outputs.app_image_repo }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          BOT_IMAGE_REPO: ${{ needs.build-and-push.outputs.bot_image_repo }}
          BOT_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          ENABLE_HTTPS_REDIRECTION: "false"
          APP_PORT: "5055"
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_COMMIT_SHORT: ${{ needs.build-and-push.outputs.short_commit }}
          DEPLOYED_AT: ${{ needs.build-and-push.outputs.deployed_at }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          DEMO_MESSAGE: Ban dang xem ban duoc deploy tu GitHub Actions commit ${{ needs.build-and-push.outputs.short_commit }}.
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: IMAGE_REPO,IMAGE_TAG,BOT_IMAGE_REPO,BOT_IMAGE_TAG,ENABLE_HTTPS_REDIRECTION,APP_PORT,BUILD_NUMBER,GIT_COMMIT_SHORT,DEPLOYED_AT,GHCR_USERNAME,GHCR_TOKEN,TELEGRAM_BOT_TOKEN,OPENAI_API_KEY,OPENAI_MODEL,DEMO_MESSAGE
          script: |
            set -e
            # Luon pull repo moi nhat tren server de file compose khop voi code vua deploy.
            cd "${{ env.APP_DIRECTORY }}"
            git pull --ff-only
            # Dang nhap GHCR tren server de co quyen pull private image neu can.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            # Export bien moi truong de docker compose thay duoc image va metadata deploy.
            export IMAGE_REPO IMAGE_TAG BOT_IMAGE_REPO BOT_IMAGE_TAG ENABLE_HTTPS_REDIRECTION APP_PORT BUILD_NUMBER GIT_COMMIT_SHORT DEPLOYED_AT DEMO_MESSAGE
            export TELEGRAM_BOT_TOKEN OPENAI_API_KEY OPENAI_MODEL
            # Pull image moi va recreate container.
            docker compose -f deploy/docker-compose.server.yml pull
            docker compose -f deploy/docker-compose.server.yml up -d
            # Don cac image cu khong con duoc su dung de tranh day disk.
            docker image prune -f
