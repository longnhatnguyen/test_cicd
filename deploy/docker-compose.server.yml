services:
  app:
    image: ${IMAGE_REPO}:${IMAGE_TAG:-latest}
    container_name: tinymvcdemo-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5055}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ENABLE_HTTPS_REDIRECTION: ${ENABLE_HTTPS_REDIRECTION:-false}
      BUILD_NUMBER: ${BUILD_NUMBER:-manual}
      GIT_COMMIT_SHORT: ${GIT_COMMIT_SHORT:-local-dev}
      DEPLOYED_AT: ${DEPLOYED_AT:-unknown}
      DEMO_MESSAGE: ${DEMO_MESSAGE:-Ban dang xem ban duoc deploy tu GitHub Actions.}

  telegram-bot:
    image: ${BOT_IMAGE_REPO}:${BOT_IMAGE_TAG:-latest}
    container_name: telegram-ai-bot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ACCESS_PASSWORD: ${TELEGRAM_ACCESS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_SYSTEM_PROMPT: ${OPENAI_SYSTEM_PROMPT:-Ban la tro ly Telegram gon gang, lich su va huu ich. Tra loi bang tieng Viet neu nguoi dung viet tieng Viet.}
      CHART_ANALYSIS_ENABLED: ${CHART_ANALYSIS_ENABLED:-false}
      CHART_ANALYSIS_CHAT_ID: ${CHART_ANALYSIS_CHAT_ID:-}
      CHART_ANALYSIS_URL: ${CHART_ANALYSIS_URL:-}
      CHART_ANALYSIS_SYMBOL: ${CHART_ANALYSIS_SYMBOL:-OANDA:XAUUSD}
      CHART_ANALYSIS_INTERVAL: ${CHART_ANALYSIS_INTERVAL:-M5}
      CHART_ANALYSIS_INTERVALS: ${CHART_ANALYSIS_INTERVALS:-M5,M15,H1,H4}
      CHART_ANALYSIS_PERIOD_MINUTES: ${CHART_ANALYSIS_PERIOD_MINUTES:-5}
      CHART_ANALYSIS_SEND_NO_TRADE: ${CHART_ANALYSIS_SEND_NO_TRADE:-false}
